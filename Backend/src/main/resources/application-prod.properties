# Production / deployed configuration — COMMITTED and secret-free.
#
# Activated with SPRING_PROFILES_ACTIVE=prod. This file must be SELF-CONTAINED:
# src/main/resources/application.properties is gitignored, so it does not exist
# in the built image — there is no base layer for this to inherit from.
#
# Every value is env-driven. Anything without a safe default is required and the
# app fails fast at startup if it is missing, which is what you want in a
# deployment: a clear boot failure beats a half-configured service.

# --- Datasource -------------------------------------------------------------
# No defaults. A typo'd env var must fail loudly, not silently fall back to a
# local database that happens to exist.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Schema -----------------------------------------------------------------
# Flyway owns the schema. `validate` makes Hibernate check the entities against
# what Flyway built and refuse to start on a mismatch, instead of altering a
# live database or (as ddl-auto=create-drop did in dev) dropping it outright.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Deployed logs are read in aggregate; SQL echo is noise.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Attachments ------------------------------------------------------------
# Boot defaults to 1MB/file, which rejects uploads before AttachmentServiceImpl's
# own 10MB check ever runs.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# --- JSON -------------------------------------------------------------------
# Matches the @JsonFormat pattern the DTOs declare and the frontend parses.
spring.jackson.date-format=MM/dd/yyyy hh:mm a
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Auth -------------------------------------------------------------------
# Required. No default: a predictable signing key is the whole ballgame.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS -------------------------------------------------------------------
# Empty by design. The frontend is served from the same origin as the API (the
# Ingress routes / to the frontend and /api to the backend), so browsers issue
# no cross-origin requests and no allowance is needed. Set this only if you
# serve the UI from a different host.
servicelink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Probes -----------------------------------------------------------------
# Only health is exposed, and only the liveness/readiness groups the kubelet
# needs. No env, metrics, beans, or heapdump on a deployed service.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
