# TEMPLATE ONLY — do not commit real values, and do not `kubectl apply` this
# file as-is. Create the secret imperatively instead so the values never touch
# the repository:
#
#   kubectl -n servicelink create secret generic servicelink-secrets \
#     --from-literal=postgres-user=servicelink \
#     --from-literal=postgres-password="$(openssl rand -base64 24)" \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)"
#
# jwt-secret must be long: JwtUtil signs with HS256, which wants at least 256
# bits of key material. 48 base64 bytes is comfortably past that.
#
# Rotating jwt-secret invalidates every issued token, logging everyone out —
# which is the point if one leaks.
apiVersion: v1
kind: Secret
metadata:
  name: servicelink-secrets
  namespace: servicelink
type: Opaque
stringData:
  postgres-user: servicelink
  postgres-password: CHANGE_ME
  jwt-secret: CHANGE_ME_AT_LEAST_32_BYTES_OF_RANDOM
