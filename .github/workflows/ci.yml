name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # The Maven project lives in the Backend/ subfolder of the repo.
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    # The Angular app lives in Frontend/ServiceLink/. Note the capital S: that
    # is the path Git tracks, and CI runs on a case-sensitive filesystem, so
    # the lowercase spelling a macOS shell reports here would not resolve.
    defaults:
      run:
        working-directory: Frontend/ServiceLink

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # @angular/cli 21 requires ^20.19 || ^22.12 || >=24.
          node-version: "22.12"
          cache: npm
          cache-dependency-path: Frontend/ServiceLink/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # vitest runs once and exits — there is no watch mode to disable, and
      # `ng test --run` is rejected as an unknown argument.
      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # Everything below runs only for pushes to main. PRs stop after the two test
  # jobs above — no PR should ever publish an image or touch the cluster.
  # ---------------------------------------------------------------------------

  images:
    name: Build & Publish Images
    needs: [build-and-test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically; no PAT to manage or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as the real identifier, plus a moving
      # `latest` for convenience. The deploy below always pins the SHA, so a
      # running pod is traceable to exactly one commit.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          # k3s on Proxmox is x86_64. Building only what is deployed keeps this
          # job roughly twice as fast as a multi-arch build nothing consumes.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/servicelink-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/servicelink-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/ServiceLink
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/servicelink-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/servicelink-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to homelab
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Runs on the self-hosted runner inside the homelab, which is why nothing
    # here needs an inbound firewall rule, a tunnel, or a kubeconfig in GitHub
    # secrets. Add matching labels to the runner when you register it.
    runs-on: [self-hosted, servicelink]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Pin manifests to this commit's images
        run: |
          cd deploy/k8s
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|g" kustomization.yaml
          grep -A1 "name: ghcr.io" kustomization.yaml

      - name: Apply manifests
        run: kubectl apply -k deploy/k8s

      # rollout status is the actual gate: it fails the job if the new pods
      # never become ready, so a broken deploy shows up as a red build instead
      # of a green one sitting on top of a crashlooping pod.
      - name: Wait for rollout
        run: |
          kubectl -n servicelink rollout status statefulset/postgres --timeout=3m
          kubectl -n servicelink rollout status deployment/backend --timeout=5m
          kubectl -n servicelink rollout status deployment/frontend --timeout=2m

      - name: Report state
        if: always()
        run: kubectl -n servicelink get pods -o wide
