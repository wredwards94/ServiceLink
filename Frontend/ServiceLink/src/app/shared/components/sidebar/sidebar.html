<nav class="nav-rail" aria-label="Main">
  <!-- Wordmark, set like the silkscreen on a rack unit. -->
  <div class="px-5 pt-6 pb-8">
    <span class="wordmark">ServiceLink</span>
    <span class="eyebrow block mt-1">IT service desk</span>
  </div>

  <div class="flex-1 px-3">
    <p class="eyebrow px-2 pb-2">Queue</p>

    <a routerLink="/dashboard" routerLinkActive="is-active" class="nav-link">
      <span class="nav-tick" aria-hidden="true"></span>
      Overview
    </a>

    <a routerLink="/tickets" routerLinkActive="is-active" class="nav-link">
      <span class="nav-tick" aria-hidden="true"></span>
      Tickets
    </a>

    @if (isAdmin) {
      <p class="eyebrow px-2 pt-6 pb-2">Administration</p>

      <a routerLink="/admin/users" routerLinkActive="is-active" class="nav-link">
        <span class="nav-tick" aria-hidden="true"></span>
        People
      </a>
    }
  </div>

  <!-- Who is holding the console. -->
  <div class="border-t border-ink-700 px-5 py-4">
    @if (displayName) {
      <p class="text-sm text-ink-100 truncate" [title]="displayName">{{ displayName }}</p>
    }
    <p class="callsign mt-0.5">{{ role }}</p>

    <button type="button" (click)="logout()" class="btn btn-ghost w-full mt-3">
      Sign out
    </button>
  </div>
</nav>
