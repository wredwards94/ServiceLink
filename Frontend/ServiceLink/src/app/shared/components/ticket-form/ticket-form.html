<div class="scrim" (click)="close()"></div>

<div class="sheet-wrap">
  <div
    class="sheet panel-raised animate-settle"
    role="dialog"
    aria-modal="true"
    aria-labelledby="new-ticket-title">
    <header class="flex items-baseline justify-between px-6 py-4 border-b border-ink-700">
      <div>
        <h2 id="new-ticket-title" class="page-title text-lg">New ticket</h2>
        <p class="eyebrow mt-0.5">Files as New</p>
      </div>
      <button type="button" class="btn btn-ghost" (click)="close()" aria-label="Close">✕</button>
    </header>

    <form (ngSubmit)="submit()" class="px-6 py-5 space-y-4">
      <div>
        <label for="title" class="block text-sm text-ink-300 mb-1.5">Title</label>
        <input
          id="title"
          name="title"
          type="text"
          class="well"
          placeholder="What is happening?"
          autofocus
          [(ngModel)]="ticket.title" />
      </div>

      <div>
        <label for="description" class="block text-sm text-ink-300 mb-1.5">Description</label>
        <textarea
          id="description"
          name="description"
          rows="4"
          class="well resize-none"
          placeholder="What you saw, what you expected, and anything you already tried."
          [(ngModel)]="ticket.description"></textarea>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label for="category" class="block text-sm text-ink-300 mb-1.5">Category</label>
          <input
            id="category"
            name="category"
            type="text"
            class="well"
            placeholder="Network, Access, Hardware…"
            [(ngModel)]="ticket.category" />
        </div>

        <div>
          <label for="ticket-priority" class="block text-sm text-ink-300 mb-1.5">Priority</label>
          <select id="ticket-priority" name="priority" class="well" [(ngModel)]="ticket.priority">
            @for (priority of priorities; track priority) {
              <option [value]="priority">{{ priorityLabel[priority] }}</option>
            }
          </select>
        </div>
      </div>

      @if (error) {
        <p class="error-note" role="alert">{{ error }}</p>
      }

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" class="btn btn-ghost" (click)="close()" [disabled]="isSubmitting">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="!isValid || isSubmitting">
          {{ isSubmitting ? 'Filing…' : 'File ticket' }}
        </button>
      </div>
    </form>
  </div>
</div>
