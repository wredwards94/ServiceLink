<div class="graticule min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-4xl grid lg:grid-cols-[1.3fr_1fr] border border-ink-700">
    <!-- Thesis: the machine you are signing in to operate. Six states, and only
         certain moves between them — that constraint is the whole product. -->
    <section class="panel border-0 lg:border-r border-ink-700 p-8 lg:p-10 hidden lg:flex flex-col justify-between">
      <div>
        <span class="wordmark">ServiceLink</span>
        <p class="eyebrow mt-1">IT service desk</p>
      </div>

      <div class="my-10 overflow-x-auto">
        <app-lifecycle-rail [status]="sampleStatus" />
      </div>

      <p class="text-sm text-ink-300 leading-relaxed max-w-xs">
        Every ticket moves through six states, and only certain moves are legal from
        each one. The rail above is that machine.
      </p>
    </section>

    <!-- Sign-in -->
    <section class="panel border-0 p-8 lg:p-10 flex flex-col justify-center">
      <div class="lg:hidden mb-8">
        <span class="wordmark">ServiceLink</span>
        <p class="eyebrow mt-1">IT service desk</p>
      </div>

      <h1 class="eyebrow">Sign in</h1>

      <form (ngSubmit)="onSubmit()" class="mt-5 space-y-4">
        <div>
          <label for="username" class="block text-sm text-ink-300 mb-1.5">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            [(ngModel)]="credentials.username"
            class="well"
            [attr.aria-invalid]="error ? 'true' : null" />
        </div>

        <div>
          <label for="password" class="block text-sm text-ink-300 mb-1.5">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            [(ngModel)]="credentials.password"
            class="well"
            [attr.aria-invalid]="error ? 'true' : null" />
        </div>

        @if (error) {
          <p class="error-note" role="alert">{{ error }}</p>
        }

        <button type="submit" class="btn btn-primary w-full" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="callsign mt-6">
        Lost your password? Ask an administrator to reset it.
      </p>
    </section>
  </div>
</div>
