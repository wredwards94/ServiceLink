server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Angular is a single-page app: the router owns /tickets/42, not the
    # filesystem. Without this fallback a hard refresh or a pasted deep link
    # 404s, because nginx looks for a file that was never built.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (outputHashing: all) are immutable — a content change
    # produces a new name — so they can be cached indefinitely.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the hashed bundles,
    # so a stale copy pins users to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Lets the Deployment's readiness probe check nginx without pulling the app.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
